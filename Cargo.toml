[workspace]
members = [
    "crates/bot_policies",
    "crates/game_core",
    "crates/game_harness",
    "crates/game_runtime",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy = { version = "0.14.2", features = ["wav"] }
